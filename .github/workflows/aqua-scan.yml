name: Aqua Security Scan
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  AQUA_KEY: ${{ secrets.AQUA_KEY }}
  AQUA_SECRET: ${{ secrets.AQUA_SECRET }}

jobs:
  supply-chain-scan:
    name: Supply Chain (Code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aqua Supply Chain Scanner
        run: |
          docker run \
            -e AQUA_KEY \
            -e AQUA_SECRET \
            -e TRIVY_RUN_AS_PLUGIN=aqua \
            -e GITHUB_REPOSITORY \
            -e GITHUB_REF_NAME \
            -e GITHUB_SHA \
            -e GITHUB_ACTOR \
            -e GITHUB_WORKFLOW \
            -e GITHUB_HEAD_REF \
            -e GITHUB_BASE_REF \
            -e GITHUB_EVENT_NAME \
            -e GITHUB_SERVER_URL \
            -e GITHUB_API_URL \
            -e GITHUB_REF \
            -e GITHUB_WORKSPACE \
            -v $(pwd):/scanning \
            aquasec/trivy:latest \
            fs --scanners vuln,secret,misconfig \
               --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
               /scanning

  image-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Aqua Image Scanner
        run: |
          docker run \
            -e AQUA_KEY \
            -e AQUA_SECRET \
            -e TRIVY_RUN_AS_PLUGIN=aqua \
            -e GITHUB_REPOSITORY \
            -e GITHUB_REF_NAME \
            -e GITHUB_SHA \
            -e GITHUB_ACTOR \
            -e GITHUB_WORKFLOW \
            -e GITHUB_HEAD_REF \
            -e GITHUB_BASE_REF \
            -e GITHUB_EVENT_NAME \
            -e GITHUB_SERVER_URL \
            -e GITHUB_API_URL \
            -e GITHUB_REF \
            aquasec/trivy:latest \
            image --scanners vuln,secret,misconfig \
                  --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
                  crapi/crapi:latest
